# App commands the secondary windows may invoke. The main window gets every
# command (permissions/main-window.toml, generated by build.rs from the invoke
# handler). Keep these lists to what the /mini and /projector routes actually
# call — a missing entry fails that call at runtime ("not allowed"), an extra
# one widens what code running in that window can do. `acl_tests` in lib.rs
# checks that every entry names a registered command.

[[set]]
identifier = "mini-window"
description = "App commands the mini player window uses."
permissions = [
  "allow-get-player-state",
  "allow-get-queue",
  "allow-get-waveform",
  "allow-check-server",
  "allow-player-prev",
  "allow-player-toggle",
  "allow-player-next",
  "allow-player-seek",
]

[[set]]
identifier = "projector-window"
description = "App commands the visualizer projector window uses."
permissions = [
  "allow-restore-session",
  "allow-get-player-state",
  "allow-get-queue",
  "allow-get-waveform",
  "allow-check-server",
  "allow-get-lyrics",
  "allow-visualizer-subscribe",
  "allow-visualizer-unsubscribe",
  "allow-fetch-weekly-preset",
]
